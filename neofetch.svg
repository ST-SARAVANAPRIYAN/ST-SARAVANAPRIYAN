<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280">
  <defs>
    <style>
      .title { font: bold 14px 'Space Mono', 'Fira Code', monospace; fill: #6272a4; }
      .prompt { font: bold 15px 'Space Mono', 'Fira Code', monospace; fill: #00e676; }
      .separator { font: 15px 'Space Mono', 'Fira Code', monospace; fill: #6272a4; }
      .key { font: bold 14px 'Space Mono', 'Fira Code', monospace; fill: #ff7a18; }
      .val { font: 14px 'Space Mono', 'Fira Code', monospace; fill: #e6edf3; }
      .bounty { font: bold 14px 'Space Mono', 'Fira Code', monospace; fill: #ffd166; }
      .df { font: bold 14px 'Space Mono', 'Fira Code', monospace; fill: #00d4ff; }
      .progress { font: 14px 'Space Mono', 'Fira Code', monospace; fill: #27c93f; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Terminal window background with shadow -->
  <rect x="15" y="15" width="820" height="250" rx="10" fill="#0b1220" stroke="#1f2937" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top bar dots -->
  <circle cx="35" cy="35" r="6" fill="#ff5f56"/>
  <circle cx="55" cy="35" r="6" fill="#ffbd2e"/>
  <circle cx="75" cy="35" r="6" fill="#27c93f"/>
  <text x="425" y="40" text-anchor="middle" class="title">saravana@mugiwara: ~</text>

  <!-- Luffy Jolly Roger (Straw Hat Skull & Crossbones) -->
  <!-- Crossbones (Under the skull) -->
  <!-- Bone 1 (Top-Left to Bottom-Right) -->
  <line x1="75" y1="100" x2="205" y2="210" stroke="#e6edf3" stroke-width="10" stroke-linecap="round"/>
  <circle cx="72" cy="97" r="8" fill="#e6edf3"/>
  <circle cx="82" cy="90" r="8" fill="#e6edf3"/>
  <circle cx="198" cy="220" r="8" fill="#e6edf3"/>
  <circle cx="208" cy="213" r="8" fill="#e6edf3"/>

  <!-- Bone 2 (Top-Right to Bottom-Left) -->
  <line x1="205" y1="100" x2="75" y2="210" stroke="#e6edf3" stroke-width="10" stroke-linecap="round"/>
  <circle cx="208" cy="97" r="8" fill="#e6edf3"/>
  <circle cx="198" cy="90" r="8" fill="#e6edf3"/>
  <circle cx="82" cy="220" r="8" fill="#e6edf3"/>
  <circle cx="72" cy="213" r="8" fill="#e6edf3"/>

  <!-- Skull Base -->
  <circle cx="140" cy="152" r="34" fill="#e6edf3" stroke="#000000" stroke-width="1.5"/>
  <rect x="124" y="176" width="32" height="18" rx="3" fill="#e6edf3" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Teeth Lines -->
  <line x1="132" y1="176" x2="132" y2="194" stroke="#000000" stroke-width="1.5"/>
  <line x1="140" y1="176" x2="140" y2="194" stroke="#000000" stroke-width="1.5"/>
  <line x1="148" y1="176" x2="148" y2="194" stroke="#000000" stroke-width="1.5"/>
  <line x1="124" y1="185" x2="156" y2="185" stroke="#000000" stroke-width="1.5"/>

  <!-- Skull Eyes and Nose -->
  <ellipse cx="127" cy="150" rx="8" ry="10" fill="#0b1220"/>
  <ellipse cx="153" cy="150" rx="8" ry="10" fill="#0b1220"/>
  <polygon points="140,158 136,166 144,166" fill="#0b1220"/>

  <!-- Straw Hat (On top of skull) -->
  <!-- Brim -->
  <ellipse cx="140" cy="128" rx="68" ry="11" fill="#ffca28" stroke="#ff8f00" stroke-width="1.5"/>
  <!-- Crown -->
  <path d="M 96 125 C 96 70, 184 70, 184 125 Z" fill="#ffca28" stroke="#ff8f00" stroke-width="1.5"/>
  <!-- Red Band -->
  <path d="M 96 116 C 111 122, 169 122, 184 116 L 185 125 C 169 131, 111 131, 95 125 Z" fill="#ff1744"/>

  <!-- Terminal text details -->
  <text x="260" y="80" class="prompt">saravana@mugiwara</text>
  <text x="260" y="96" class="separator">-----------------</text>
  
  <text x="260" y="116">
    <tspan class="key">Type:</tspan> <tspan class="val">Full-Stack Engineer / AI Builder</tspan>
  </text>
  <text x="260" y="134">
    <tspan class="key">Crew:</tspan> <tspan class="val">Straw Hat Pirates (Mugiwara)</tspan>
  </text>
  <text x="260" y="152">
    <tspan class="key">Haki:</tspan> <tspan class="val">Code &amp; Systems Architecture</tspan>
  </text>
  <text x="260" y="170">
    <tspan class="key">Bounty:</tspan> <tspan class="bounty">฿9,999,999,999</tspan> <tspan class="val">(in lines of code)</tspan>
  </text>
  <text x="260" y="188">
    <tspan class="key">Devil Fruit:</tspan> <tspan class="df">Git-Git Fruit (Paramecia)</tspan>
  </text>
  <text x="260" y="206">
    <tspan class="key">Caffeine:</tspan> <tspan class="progress">[████████████░] 92%</tspan>
  </text>
  <text x="260" y="224">
    <tspan class="key">OS:</tspan> <tspan class="val">Neurodiverse-OS x86_64</tspan>
  </text>
  <text x="260" y="242">
    <tspan class="key">Uptime:</tspan> <tspan class="val">24h/7d without memory leaks</tspan>
  </text>
</svg>
